<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Management - Admin</title>
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="tasks.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="../auth-check.js"></script>
</head>
<body>
  <div class="admin-container">
    <!-- Sidebar (copy from admin.html) -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2><i class="fas fa-users-cog"></i> Admin Panel</h2>
      </div>
      <nav class="sidebar-nav">
        <ul>
          <li class="nav-item" data-section="dashboard">
            <a href="../dashboard/dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
          </li>
          <li class="nav-item" data-section="employees">
            <a href="../employees/employees.html"><i class="fas fa-users"></i> Employees</a>
          </li>
          <li class="nav-item" data-section="attendance">
            <a href="../attendance/attendance.html"><i class="fas fa-clock"></i> Attendance</a>
          </li>
          <li class="nav-item" data-section="leaves">
            <a href="../leaves/leaves.html"><i class="fas fa-calendar-alt"></i> Leave Management</a>
          </li>
          <li class="nav-item active" data-section="tasks">
            <a href="tasks.html"><i class="fas fa-tasks"></i> Tasks</a>
          </li>
          <li class="nav-item" data-section="messages">
            <a href="../messages/messages.html"><i class="fas fa-envelope"></i> Messages</a>
          </li>
          <li class="nav-item" data-section="reports">
            <a href="../reports/reports.html"><i class="fas fa-chart-bar"></i> Reports</a>
          </li>
          <li class="nav-item" data-section="settings">
            <a href="../settings/settings.html"><i class="fas fa-cog"></i> Settings</a>
          </li>
        </ul>
      </nav>
      <div class="sidebar-footer">
        <button id="logoutBtn" class="logout-btn">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
    </aside>
    <!-- Main Content -->
    <main class="main-content">

      <!-- Tasks Section (copied from admin.html) -->
      <div class="content-wrapper">
        <div class="section-header">
          <h2>Task Management</h2>
          <button id="addTaskBtn" class="btn btn-primary">
            <i class="fas fa-plus"></i> Add Task
          </button>
        </div>
        
        <!-- Task Statistics -->
        <div class="task-stats" style="display: flex; gap: 2rem; justify-content: flex-start; margin-bottom: 2rem;">
          <div class="stat-item stat-card" style="background: #f5f7fa; border-radius: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.06); padding: 1.5rem 2.5rem; display: flex; align-items: center; min-width: 200px;">
            <span style="font-size: 2.2rem; color: #4e73df; margin-right: 1rem;"><i class="fas fa-tasks"></i></span>
            <div>
              <div class="stat-label" style="font-weight: 600; color: #6c757d;">Total Tasks</div>
              <span id="totalTasks" class="stat-value" style="font-size: 2rem; font-weight: bold; color: #222;">0</span>
            </div>
          </div>
          <div class="stat-item stat-card" style="background: #fff3cd; border-radius: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.06); padding: 1.5rem 2.5rem; display: flex; align-items: center; min-width: 200px;">
            <span style="font-size: 2.2rem; color: #ffc107; margin-right: 1rem;"><i class="fas fa-clock"></i></span>
            <div>
              <div class="stat-label" style="font-weight: 600; color: #856404;">Pending</div>
              <span id="pendingTasks" class="stat-value" style="font-size: 2rem; font-weight: bold; color: #222;">0</span>
            </div>
          </div>
          <div class="stat-item stat-card" style="background: #e8f5e9; border-radius: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.06); padding: 1.5rem 2.5rem; display: flex; align-items: center; min-width: 200px;">
            <span style="font-size: 2.2rem; color: #28a745; margin-right: 1rem;"><i class="fas fa-check-circle"></i></span>
            <div>
              <div class="stat-label" style="font-weight: 600; color: #388e3c;">Completed</div>
              <span id="completedTasks" class="stat-value" style="font-size: 2rem; font-weight: bold; color: #222;">0</span>
            </div>
          </div>
        </div>
        <div class="filters">
          <select id="taskStatusFilter" class="filter-select">
            <option value="">All Status</option>
            <option value="pending">Pending</option>
            <option value="in-progress">In Progress</option>
            <option value="completed">Completed</option>
          </select>
          <select id="taskPriorityFilter" class="filter-select">
            <option value="">All Priorities</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
            <option value="urgent">Urgent</option>
          </select>
        </div>
        <div class="table-container">
          <table id="tasksTable" class="data-table">
            <thead>
              <tr>
                <th>Title</th>
                <th>Assigned To</th>
                <th>Priority</th>
                <th>Due Date</th>
                <th>Progress</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="tasksTableBody">
              <!-- Tasks will be loaded dynamically here -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Add Task Modal -->
  <div id="addTaskModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Add New Task</h3>
        <span class="close">&times;</span>
      </div>
      <form id="addTaskForm">
        <div class="form-group">
          <label>Title *</label>
          <input type="text" name="title" required class="form-input">
        </div>
        <div class="form-group">
          <label>Description *</label>
          <textarea name="description" required class="form-input" rows="3"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Assigned To *</label>
            <select name="assignedTo" id="assignedTo" required class="form-input">
              <option value="">Select Employee</option>
            </select>
          </div>
          <div class="form-group">
            <label>Priority</label>
            <select name="priority" class="form-input">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
              <option value="urgent">Urgent</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Due Date *</label>
          <input type="date" name="dueDate" required class="form-input">
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="closeModal('addTaskModal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Add Task</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Edit Task Modal -->
  <div id="editTaskModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Edit Task</h3>
        <span class="close">&times;</span>
      </div>
      <form id="editTaskForm">
        <input type="hidden" name="taskId" id="editTaskId">
        <div class="form-group">
          <label>Title *</label>
          <input type="text" name="title" id="editTitle" required class="form-input">
        </div>
        <div class="form-group">
          <label>Description *</label>
          <textarea name="description" id="editDescription" required class="form-input" rows="3"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Assigned To *</label>
            <select name="assignedTo" id="editAssignedTo" required class="form-input">
              <option value="">Select Employee</option>
            </select>
          </div>
          <div class="form-group">
            <label>Priority</label>
            <select name="priority" id="editPriority" class="form-input">
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
              <option value="urgent">Urgent</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Status</label>
            <select name="status" id="editStatus" class="form-input">
              <option value="pending">Pending</option>
              <option value="in-progress">In Progress</option>
              <option value="completed">Completed</option>
            </select>
          </div>
          <div class="form-group">
            <label>Progress (%)</label>
            <input type="number" name="progress" id="editProgress" class="form-input" min="0" max="100" value="0">
          </div>
        </div>
        <div class="form-group">
          <label>Due Date *</label>
          <input type="date" name="dueDate" id="editDueDate" required class="form-input">
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="closeModal('editTaskModal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Update Task</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Loading Spinner -->
  <div id="loadingSpinner" class="loading-spinner">
    <div class="spinner"></div>
  </div>

  <script src="tasks.js"></script>
</body>
</html>
