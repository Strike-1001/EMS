<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Management - Admin Panel</title>
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="attendance.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="../auth-check.js"></script>
</head>
<body>
  <div class="admin-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2><i class="fas fa-users-cog"></i> Admin Panel</h2>
      </div>
      <nav class="sidebar-nav">
        <ul>
          <li class="nav-item" data-section="dashboard">
            <a href="../dashboard/dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
          </li>
          <li class="nav-item" data-section="employees">
            <a href="../employees/employees.html"><i class="fas fa-users"></i> Employees</a>
          </li>
          <li class="nav-item active" data-section="attendance">
            <a href="#attendance"><i class="fas fa-clock"></i> Attendance</a>
          </li>
          <li class="nav-item" data-section="leaves">
            <a href="../leaves/leaves.html"><i class="fas fa-calendar-alt"></i> Leave Management</a>
          </li>
          <li class="nav-item" data-section="tasks">
            <a href="../tasks/tasks.html"><i class="fas fa-tasks"></i> Tasks</a>
          </li>
          <li class="nav-item" data-section="messages">
            <a href="../messages/messages.html"><i class="fas fa-envelope"></i> Messages</a>
          </li>
          <li class="nav-item" data-section="reports">
            <a href="../reports/reports.html"><i class="fas fa-chart-bar"></i> Reports</a>
          </li>
          <li class="nav-item" data-section="settings">
            <a href="../settings/settings.html"><i class="fas fa-cog"></i> Settings</a>
          </li>
        </ul>
      </nav>
      <div class="sidebar-footer">
        <button id="logoutBtn" class="logout-btn">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">

      <!-- Attendance Section -->
      <div class="content-wrapper">
        <div class="section-header">
          <h2>Attendance Management</h2>
          <div class="date-filters">
            <input type="date" id="startDate" class="date-input">
            <input type="date" id="endDate" class="date-input">
            <button id="filterAttendance" class="btn btn-secondary">Filter</button>
          </div>
        </div>


        <div class="attendance-stats" style="display: flex; gap: 2rem; justify-content: flex-start; margin-bottom: 2rem;">
  <div class="stat-item stat-card" style="background: #f5f7fa; border-radius: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.06); padding: 1.5rem 2.5rem; display: flex; align-items: center; min-width: 200px;">
    <span style="font-size: 2.2rem; color: #4e73df; margin-right: 1rem;"><i class="fas fa-user-check"></i></span>
    <div>
      <div class="stat-label" style="font-weight: 600; color: #6c757d;">Present</div>
      <span id="presentCount" class="stat-value" style="font-size: 2rem; font-weight: bold; color: #222;">5</span>
    </div>
  </div>
  <div class="stat-item stat-card" style="background: #fee2e2; border-radius: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.06); padding: 1.5rem 2.5rem; display: flex; align-items: center; min-width: 200px;">
    <span style="font-size: 2.2rem; color: #dc3545; margin-right: 1rem;"><i class="fas fa-user-times"></i></span>
    <div>
      <div class="stat-label" style="font-weight: 600; color: #b91c1c;">Absent</div>
      <span id="absentCount" class="stat-value" style="font-size: 2rem; font-weight: bold; color: #222;">3</span>
    </div>
  </div>
  <div class="stat-item stat-card" style="background: #fff3cd; border-radius: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.06); padding: 1.5rem 2.5rem; display: flex; align-items: center; min-width: 200px;">
    <span style="font-size: 2.2rem; color: #fd7e14; margin-right: 1rem;"><i class="fas fa-user-clock"></i></span>
    <div>
      <div class="stat-label" style="font-weight: 600; color: #856404;">Late</div>
      <span id="lateCount" class="stat-value" style="font-size: 2rem; font-weight: bold; color: #222;">2</span>
    </div>
  </div>
</div>

        <div class="table-container">
          <table id="attendanceTable" class="data-table">
            <thead>
              <tr>
                <th>Employee</th>
                <th>Date</th>
                <th>Check In</th>
                <th>Check Out</th>
                <th>Total Hours</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="attendanceTableBody">
              <!-- Attendance data will be loaded dynamically from backend -->
            </tbody>
          </table>
        </div>
        
      </div>
    </main>
  </div>
  <div id="loadingSpinner" class="loading-spinner">
    <div class="spinner"></div>
  </div>
  <script src="attendance.js"></script>
</body>
</html>
