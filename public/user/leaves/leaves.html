<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Leaves | Employee Panel</title>
  <link rel="stylesheet" href="leaves.css">
  <link rel ="stylesheet" href="../sidebar.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="user-container">
    <div class="sidebar">
        <div class="sidebar-header">
            <h2><i class="fas fa-user-circle"></i> Employee Portal</h2>
        </div>
        <nav class="sidebar-nav">
            <ul>
                <li class="nav-item" data-section="dashboard">
                    <a href="/user/dashboard/dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
                </li>
                <li class="nav-item" data-section="profile">
                    <a href="/user/profile/profile.html"><i class="fas fa-user"></i> My Profile</a>
                </li>
                <li class="nav-item" data-section="attendance">
                    <a href="/user/attendance/attendance.html"><i class="fas fa-clock"></i> Attendance</a>
                </li>
                <li class="nav-item active" data-section="leaves">
                    <a href="/user/leaves/leaves.html"><i class="fas fa-calendar-alt"></i> Leave Requests</a>
                </li>
                <li class="nav-item" data-section="tasks">
                    <a href="/user/tasks/tasks.html"><i class="fas fa-tasks"></i> My Tasks</a>
                </li>
                <li class="nav-item" data-section="messages">
                    <a href="/user/messages/messages.html"><i class="fas fa-envelope"></i> Messages</a>
                </li>
                <li class="nav-item" data-section="documents">
                    <a href="/user/documents/documents.html"><i class="fas fa-file-alt"></i> Documents</a>
                </li>
                <li class="nav-item" id="logoutNav">
                    <a href="/user/login.html"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </li>
            </ul>
        </nav>
    </div>
    <script src="../sidebar.js"></script>
    <!-- Main Content -->
    <div class="main-content">
      <!-- Page Header -->
      <header class="leaves-header">
        <h1>My Leaves <span>🗓️</span></h1>
        <button class="export-btn">
          <span>Export</span>
          <i class="fas fa-file-export"></i>
        </button>
        
      </header>
            <!-- Notifications / Alerts Section -->
            <div id="alert-section" class="max-w-3xl mx-auto mt-4"></div>
      <main>

        <div class="leaves-flex-container">
          <!-- Leave Application Form -->
          <section class="leaves-form-section">
            <h2>Request Leave</h2>
            <form id="leave-form" enctype="multipart/form-data">
              <div class="form-group">
                <label for="startDate">Start Date<span class="required">*</span></label>
                <input type="date" id="startDate" name="startDate" required min="{{today}}">
              </div>
              <div class="form-group">
                <label for="endDate">End Date<span class="required">*</span></label>
                <input type="date" id="endDate" name="endDate" required min="{{today}}">
              </div>
              <div class="form-group">
                <label for="reason">Reason<span class="required">*</span></label>
                <textarea id="reason" name="reason" required minlength="10" rows="3" placeholder="Describe your reason (min 10 chars)"></textarea>
              </div>
              <div class="form-group">
                <label for="document">Attach Document (optional)</label>
                <input type="file" id="document" name="document" accept=".pdf,.jpg,.jpeg,.png">
              </div>
              <button type="submit" class="submit-btn">Submit Request</button>
            </form>
          </section>
          <section class="leaves-table-section">
            <!-- Leave Filter & Search Controls -->
            <div class="leaves-filter-controls">
              <input type="text" id="searchReason" placeholder="Search by Reason or Status" />
              <input type="date" id="filterStart" />
              <span class="filter-to">to</span>
              <input type="date" id="filterEnd" />
              <button class="clear-filters-btn">Clear Filters</button>
            </div>
            <!-- Leave History Table -->
            <div class="leaves-table-container">
              <table class="leaves-table">
                <thead>
                  <tr>
                    <th>Date Range</th>
                    <th>Reason</th>
                    <th>Status</th>
                    <th>Admin Remarks</th>
                  </tr>
                </thead>
                <tbody>
                  <!-- Leave history will be loaded dynamically from backend -->
                </tbody>
              </table>
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>
  <script src="leaves.js"></script>
</body>
</html>
