<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: #f4f6f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        .register-container {
            background: #fff;
            max-width: 450px;
            margin: 40px auto;
            padding: 32px 28px 24px 28px;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        h2 {
            text-align: center;
            margin-bottom: 28px;
            color: #333;
            font-size: 24px;
        }
        .register-form .form-group {
            margin-bottom: 20px;
        }
        .register-form label {
            display: block;
            margin-bottom: 8px;
            color: #444;
            font-size: 15px;
            font-weight: 500;
        }
        .register-form input,
        .register-form select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
            background: #f9fafb;
            transition: all 0.2s;
            box-sizing: border-box;
        }
        .register-form input:focus,
        .register-form select:focus {
            border-color: #4f8cff;
            outline: none;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(79, 140, 255, 0.1);
        }
        .register-btn {
            width: 100%;
            padding: 14px 0;
            background: #4f8cff;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 12px;
        }
        .register-btn:hover {
            background: #2563eb;
        }
        .register-btn:active {
            transform: translateY(1px);
        }
        p {
            text-align: center;
            margin-top: 20px;
            color: #555;
            line-height: 1.5;
        }
        a {
            color: #4f8cff;
            text-decoration: none;
            font-weight: 500;
        }
        a:hover {
            text-decoration: underline;
        }
        .info-note {
            background: #f0f9ff;
            border: 1px solid #bae6fd;
            border-radius: 6px;
            padding: 12px 16px;
            margin-top: 16px;
            font-size: 14px;
            color: #0369a1;
            line-height: 1.4;
        }
        .info-note i {
            margin-right: 8px;
            color: #0284c7;
        }
        
        /* Success Message Styles */
        .success-container {
            text-align: center;
            padding: 2rem 0;
        }
        
        .success-icon {
            font-size: 4rem;
            color: #10b981;
            margin-bottom: 1rem;
        }
        
        .success-container h3 {
            color: #10b981;
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }
        
        .success-container p {
            color: #374151;
            margin-bottom: 1rem;
            line-height: 1.6;
        }
        
        .login-info {
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 1rem;
            margin: 1.5rem 0;
            text-align: left;
        }
        
        .login-info p {
            margin: 0.5rem 0;
            font-size: 0.9rem;
        }
        
        .admin-note {
            background: #dbeafe;
            border: 1px solid #93c5fd;
            border-radius: 8px;
            padding: 1rem;
            margin: 1.5rem 0;
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
        }
        
        .admin-note i {
            color: #1e40af;
            margin-top: 0.125rem;
        }
        
        .admin-note p {
            margin: 0;
            color: #1e40af;
            font-size: 0.9rem;
            line-height: 1.5;
        }
        
        .action-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
        }
        
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .btn-primary {
            background: #3b82f6;
            color: white;
        }
        
        .btn-primary:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }
        
        .btn-secondary {
            background: #6b7280;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #4b5563;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="register-container">
        <h2>Employee Registration</h2>
        <form id="registerForm" class="register-form">
            <div class="form-group">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" name="firstName" required>
            </div>
            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" name="lastName" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" required pattern="[0-9]{10}">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
            </div>
            <button type="submit" class="register-btn">Register</button>
        </form>
        <p>Already have an account? <a href="login.html">Login here</a>.</p>
        <div class="info-note">
            <i class="fas fa-info-circle"></i> 
            Note: After registration, an admin will complete your profile with department, position, salary, and hire date details.
        </div>
    </div>
    <script src="register.js"></script>
</body>
</html>
