<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <style>
        body {
            background: #f4f6fb;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .choice-container {
            background: #fff;
            padding: 2.5rem 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }
        .choice-title {
            font-size: 2rem;
            color: #333;
            margin-bottom: 1.5rem;
        }
        .choice-buttons {
            display: flex;
            gap: 2rem;
        }
        .choice-btn {
            text-decoration: none;
            padding: 1rem 2.5rem;
            font-size: 1.2rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #1976d2;
            color: #fff;
            transition: background 0.2s;
        }
        .choice-btn:hover {
            background: #125ea2;
        }
    </style>
</head>
<body>
    <div class="choice-container">
        <div class="choice-title">Welcome! Please select your role:</div>
        <div class="choice-buttons">
            <a class="choice-btn" href="/admin/login.html">Admin</a>
            <a class="choice-btn" href="/user/login.html">Employee</a>
        </div>
    </div>
</body>
</html>
